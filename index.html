<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Escape The Granny House 2.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="start-screen">
        <h1>THE ESCAPE 2.0</h1>
        <p>Thứ tự: Tìm chìa Biển ➔ Chìa Xanh Lá ➔ Chìa Vàng & Kiềm ➔ Mật Mã ➔ Cắt xích & Giải mã cửa thoát hiểm. Trốn vào tủ khi quái vật đến!</p>
        <button id="btn-start">CHƠI NGAY</button>
    </div>

    <div id="game-over" class="hidden">
        <h1 id="end-title">THẮNG RỒI</h1>
        <button id="btn-restart">CHƠI LẠI</button>
    </div>

    <div id="ui" class="hidden">
        <!-- Cập nhật túi đồ hiển thị -->
        <div id="info">
            🎒 Túi: <span id="inv-keys">Chưa có gì</span> <br>
            🛠 Dụng cụ: <span id="inv-tools">Trống</span> <br>
            📜 Mật mã: <span id="inv-code">???</span>
        </div>
        <div id="crosshair"></div>
        <div id="prompt">Bấm ✋ / Phím E</div>
        
        <div id="touch-look-zone"></div>
        <div id="joystick-base"><div id="joystick-stick"></div></div>
        <div id="btn-action">✋<br>LẤY</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
